<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"

            crossorigin

        <style>
            :root {
                --navy: #0b1829;
                --navy-mid: #132238;
                --navy-light: #1e3a5f;
                --gold: #f0a500;
                --gold-light: #ffd166;
                --teal: #0d9488;
                --cream: #fafaf8;
                --danger: #ef4444;
                --success: #22c55e;
            }
            .dark-mode {
                --cream: #0f172a;
            }
            * {
                box-sizing: border-box;
            }
            body {
                font-family: "DM Sans", sans-serif;
                background: var(--cream);
                color: #1a2332;
                margin: 0;
                transition: background 0.3s, color 0.3s;
            }
            body.dark {
                background: #0f172a;
                color: #e2e8f0;
            }
            h1,
            h2,
            h3 {
                font-family: "DM Serif Display", serif;
            }
            code,
            pre {
                font-family: "JetBrains Mono", monospace;
            }
            .sidebar {
                background: var(--navy);
                min-height: 100vh;
            }
            .nav-btn {
                transition: all 0.2s;
                border-left: 3px solid transparent;
            }
            .nav-btn.active {
                background: var(--navy-light);
                border-left-color: var(--gold);
            }
            .nav-btn:hover:not(.active) {
                background: var(--navy-mid);
                border-left-color: rgba(240, 165, 0, 0.4);
            }
            .card {
                background: white;
                border-radius: 12px;
                border: 1px solid #e8eaf0;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            }
            body.dark .card {
                background: #1e293b;
                border-color: #334155;
                color: #e2e8f0;
            }
            body.dark .card p,
            body.dark .card span,
            body.dark .card li {
                color: #cbd5e1;
            }
            .badge-piege {
                background: #fef3c7;
                color: #92400e;
                border: 1px solid #fcd34d;
                border-radius: 20px;
                padding: 2px 10px;
                font-size: 0.75rem;
                font-weight: 600;
            }
            .badge-key {
                background: #ede9fe;
                color: #5b21b6;
                border: 1px solid #c4b5fd;
                border-radius: 20px;
                padding: 2px 10px;
                font-size: 0.75rem;
                font-weight: 600;
            }
            .quiz-btn {
                transition: all 0.2s;
                border: 2px solid #e2e8f0;
                border-radius: 10px;
                padding: 14px 18px;
                text-align: left;
                width: 100%;
                cursor: pointer;
                background: white;
            }
            body.dark .quiz-btn {
                background: #1e293b;
                border-color: #334155;
                color: #e2e8f0;
            }
            .quiz-btn:hover:not(:disabled) {
                border-color: #6366f1;
                background: #f5f3ff;
            }
            body.dark .quiz-btn:hover:not(:disabled) {
                background: #2d3748;
            }
            .quiz-btn.correct {
                border-color: #22c55e !important;
                background: #f0fdf4 !important;
                color: #14532d !important;
            }
            .quiz-btn.wrong {
                border-color: #ef4444 !important;
                background: #fef2f2 !important;
                color: #7f1d1d !important;
            }
            .quiz-btn.reveal-correct {
                border-color: #22c55e !important;
                background: #f0fdf4 !important;
                color: #14532d !important;
            }
            .quiz-btn:disabled {
                cursor: default;
            }
            .progress-bar {
                height: 6px;
                background: rgba(255, 255, 255, 0.15);
                border-radius: 3px;
                overflow: hidden;
            }
            .progress-fill {
                height: 100%;
                background: var(--gold);
                border-radius: 3px;
                transition: width 0.4s ease;
            }
            .code-block {
                background: #0f172a;
                color: #e2e8f0;
                border-radius: 10px;
                padding: 16px;
                overflow-x: auto;
                font-size: 0.8rem;
                line-height: 1.6;
                border: 1px solid #1e3a5f;
            }
            .code-keyword {
                color: #7dd3fc;
            }
            .code-string {
                color: #86efac;
            }
            .code-annotation {
                color: #fbbf24;
            }
            .code-comment {
                color: #64748b;
            }
            .abbr-tag {
                display: inline-block;
                background: #f0f9ff;
                border: 1px solid #bae6fd;
                color: #0369a1;
                border-radius: 6px;
                padding: 2px 8px;
                font-size: 0.8rem;
                font-weight: 600;
                margin: 2px 3px;
            }
            .tab-btn {
                border-radius: 8px;
                padding: 6px 14px;
                font-size: 0.85rem;
                font-weight: 600;
                transition: all 0.2s;
                cursor: pointer;
                border: 1px solid transparent;
            }
            .tab-btn.active {
                background: #1e3a5f;
                color: white;
            }
            .tab-btn:not(.active) {
                color: #64748b;
            }
            .tab-btn:not(.active):hover {
                background: #f1f5f9;
            }
            body.dark .tab-btn:not(.active) {
                color: #94a3b8;
            }
            body.dark .tab-btn:not(.active):hover {
                background: #1e293b;
            }
            details summary {
                cursor: pointer;
                list-style: none;
            }
            details summary::-webkit-details-marker {
                display: none;
            }
            .chevron {
                transition: transform 0.2s;
                display: inline-block;
            }
            .module-tag {
                font-size: 0.7rem;
                font-weight: 700;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                color: var(--gold);
            }
            /* Flashcard styles */
            .flip-card {
                perspective: 1000px;
                height: 150px;
                cursor: pointer;
            }
            .flip-card-inner {
                position: relative;
                width: 100%;
                height: 100%;
                transition: transform 0.6s;
                transform-style: preserve-3d;
            }
            .flip-card.flipped .flip-card-inner {
                transform: rotateY(180deg);
            }
            .flip-face {
                position: absolute;
                width: 100%;
                height: 100%;
                backface-visibility: hidden;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 1rem;
                border-radius: 10px;
            }
            .flip-front {
                background: white;
                border: 1px solid #e2e8f0;
                color: #1e40af;
                font-weight: 700;
                text-align: center;
                font-size: 0.9rem;
            }
            body.dark .flip-front {
                background: #1e293b;
                border-color: #334155;
                color: #93c5fd;
            }
            .flip-back {
                background: #1e3a5f;
                color: white;
                transform: rotateY(180deg);
                font-size: 0.82rem;
                text-align: center;
                line-height: 1.5;
            }
            /* Search highlight */
            .highlight {
                background: #fef08a;
                border-radius: 2px;
                padding: 0 2px;
            }
            body.dark .highlight {
                background: #854d0e;
                color: #fef9c3;
            }
            /* Fav star */
            .fav-btn {
                transition: all 0.15s;
                color: #cbd5e1;
            }
            .fav-btn.active {
                color: #f59e0b;
            }
            .fav-btn:hover {
                color: #f59e0b;
                transform: scale(1.2);
            }
            /* Streak badge */
            .streak-badge {
                background: linear-gradient(135deg, #f97316, #ef4444);
                color: white;
                border-radius: 20px;
                padding: 4px 12px;
                font-size: 0.78rem;
                font-weight: 700;
            }
            /* HTTP method badges */
            .http-get {
                background: #d1fae5;
                color: #065f46;
                border: 1px solid #6ee7b7;
            }
            .http-post {
                background: #fef3c7;
                color: #78350f;
                border: 1px solid #fcd34d;
            }
            .http-put {
                background: #dbeafe;
                color: #1e3a8a;
                border: 1px solid #93c5fd;
            }
            .http-delete {
                background: #fee2e2;
                color: #7f1d1d;
                border: 1px solid #fca5a5;
            }
            .http-badge {
                border-radius: 6px;
                padding: 2px 10px;
                font-size: 0.78rem;
                font-weight: 700;
                font-family: "JetBrains Mono", monospace;
                display: inline-block;
            }
            /* Nav search */
            .nav-search {
                background: rgba(255, 255, 255, 0.07);
                border: 1px solid #1e3a5f;
                color: white;
                border-radius: 8px;
                padding: 7px 12px;
                width: 100%;
                font-size: 0.85rem;
                outline: none;
                transition: border 0.2s;
            }
            .nav-search:focus {
                border-color: var(--gold);
            }
            .nav-search::placeholder {
                color: #475569;
            }
            /* Responsive */
            @media (max-width: 768px) {
                .sidebar {
                    min-height: auto;
                }
            }
            ::-webkit-scrollbar {
                width: 6px;
            }
            ::-webkit-scrollbar-thumb {
                background: #cbd5e1;
                border-radius: 3px;
            }
            /* Modal overlay */
            .modal-overlay {
                position: fixed;
                inset: 0;
                z-index: 50;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 1rem;
                background: rgba(0, 0, 0, 0.5);
                backdrop-filter: blur(2px);
            }
            /* Flashcard mode overlay */
            .fc-overlay {
                position: fixed;
                inset: 0;
                z-index: 60;
                background: #0b1829;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
            }
            /* QCM radio */
            .qcm-option {
                transition: all 0.2s;
                border: 2px solid #e2e8f0;
                border-radius: 10px;
                padding: 12px 16px;
                cursor: pointer;
                background: white;
                display: flex;
                align-items: center;
                gap: 10px;
            }
            body.dark .qcm-option {
                background: #1e293b;
                border-color: #334155;
                color: #e2e8f0;
            }
            .qcm-option:hover:not(.disabled) {
                border-color: #6366f1;
                background: #f5f3ff;
            }
            body.dark .qcm-option:hover:not(.disabled) {
                background: #2d3748;
            }
            .qcm-option.correct {
                border-color: #22c55e !important;
                background: #f0fdf4 !important;
            }
            .qcm-option.wrong {
                border-color: #ef4444 !important;
                background: #fef2f2 !important;
            }
            .qcm-option.reveal {
                border-color: #22c55e !important;
                background: #f0fdf4 !important;
            }
            .qcm-option.disabled {
                cursor: default;
            }
            /* Perf chart */
            .perf-bar {
                background: #e2e8f0;
                border-radius: 4px;
                overflow: hidden;
                height: 8px;
            }
            body.dark .perf-bar {
                background: #334155;
            }
            .perf-fill {
                height: 100%;
                border-radius: 4px;
                transition: width 0.6s ease;
            }
            /* Toast */
            .toast {
                position: fixed;
                bottom: 24px;
                right: 24px;
                z-index: 100;
                background: #1e293b;
                color: white;
                border-radius: 12px;
                padding: 12px 20px;
                font-size: 0.88rem;
                font-weight: 600;
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
                transform: translateY(100px);
                opacity: 0;
                transition: all 0.3s ease;
                border-left: 4px solid var(--gold);
            }
            .toast.show {
                transform: translateY(0);
                opacity: 1;
            }
            /* Annotation */
            .annotation-btn {
                font-size: 0.75rem;
                color: #94a3b8;
                border: 1px dashed #cbd5e1;
                border-radius: 6px;
                padding: 3px 8px;
                cursor: pointer;
                transition: all 0.15s;
            }
            .annotation-btn:hover {
                border-color: #6366f1;
                color: #6366f1;
            }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <script type="text/babel">
            /* ============================================================
   LOCALSTORAGE HELPERS
   ============================================================ */
            const LS = "sw_miage_";
            const storage = {
                getQuiz: (id) => {
                    try {
                        const r = localStorage.getItem(`${LS}quiz_${id}`);
                        return r ? JSON.parse(r) : null;
                    } catch {
                        return null;
                    }
                },
                setQuiz: (id, s) => {
                    try {
                        localStorage.setItem(
                            `${LS}quiz_${id}`,
                            JSON.stringify(s)
                        );
                    } catch {}
                },
                removeQuiz: (id) => {
                    try {
                        localStorage.removeItem(`${LS}quiz_${id}`);
                    } catch {}
                },
                getCompleted: () => {
                    try {
                        const r = localStorage.getItem(`${LS}completed`);
                        return r ? JSON.parse(r) : [];
                    } catch {
                        return [];
                    }
                },
                setCompleted: (a) => {
                    try {
                        localStorage.setItem(
                            `${LS}completed`,
                            JSON.stringify(a)
                        );
                    } catch {}
                },
                getFavs: () => {
                    try {
                        const r = localStorage.getItem(`${LS}favs`);
                        return r ? JSON.parse(r) : [];
                    } catch {
                        return [];
                    }
                },
                setFavs: (a) => {
                    try {
                        localStorage.setItem(`${LS}favs`, JSON.stringify(a));
                    } catch {}
                },
                getAnnotations: () => {
                    try {
                        const r = localStorage.getItem(`${LS}annotations`);
                        return r ? JSON.parse(r) : {};
                    } catch {
                        return {};
                    }
                },
                setAnnotations: (o) => {
                    try {
                        localStorage.setItem(
                            `${LS}annotations`,
                            JSON.stringify(o)
                        );
                    } catch {}
                },
                getStreak: () => {
                    try {
                        const r = localStorage.getItem(`${LS}streak`);
                        return r ? JSON.parse(r) : { count: 0, last: null };
                    } catch {
                        return { count: 0, last: null };
                    }
                },
                setStreak: (o) => {
                    try {
                        localStorage.setItem(`${LS}streak`, JSON.stringify(o));
                    } catch {}
                },
                getDarkMode: () => {
                    try {
                        return localStorage.getItem(`${LS}dark`) === "1";
                    } catch {
                        return false;
                    }
                },
                setDarkMode: (v) => {
                    try {
                        localStorage.setItem(`${LS}dark`, v ? "1" : "0");
                    } catch {}
                },
                resetAll: () => {
                    try {
                        Object.keys(localStorage)
                            .filter((k) => k.startsWith(LS))
                            .forEach((k) => localStorage.removeItem(k));
                    } catch {}
                },
            };

            /* ============================================================
   COURSE DATA — Services Web M2 MIAGE IPM
   ============================================================ */

   ============================================================ */
            const QuizSection = ({
                moduleId,
                questions,
                moduleColor,
                onComplete,
                onReset,
                darkMode,
            }) => {
                const loadState = () => {
                    const saved = storage.getQuiz(moduleId);
                    if (saved) return saved;
                    return { current: 0, answers: {}, done: false };
                };
                const [state, setStateRaw] = React.useState(loadState);
                const setState = (updater) => {
                    setStateRaw((prev) => {
                        const next =
                            typeof updater === "function"
                                ? updater(prev)
                                : updater;
                        storage.setQuiz(moduleId, next);
                        return next;
                    });
                };
                const { current, answers, done } = state;
                const q = questions[current];
                const answered = answers[current] !== undefined;
                const userAnswer = answers[current];
                const isCorrect =
                    answered &&
                    (q.type === "tf" ? userAnswer === q.a : userAnswer === q.a);
                const finalScore = Object.keys(answers).filter((k) => {
                    const qi = questions[parseInt(k)];
                    return qi && answers[k] === qi.a;
                }).length;

                const handleAnswer = (val) => {
                    if (answered) return;
                    setState((prev) => ({
                        ...prev,
                        answers: { ...prev.answers, [current]: val },
                    }));
                };

                const handleNext = () => {
                    if (current < questions.length - 1) {
                        setState((prev) => ({
                            ...prev,
                            current: prev.current + 1,
                        }));
                    } else {
                        setState((prev) => ({ ...prev, done: true }));
                        onComplete(
                            finalScore +
                                (isCorrect ? 0 : userAnswer === q.a ? 1 : 0)
                        );
                    }
                };

                const handleReset = () => {
                    storage.removeQuiz(moduleId);
                    setState({ current: 0, answers: {}, done: false });
                    onReset(moduleId);
                };

                if (done) {
                    const totalQuestions = questions.length;
                    const score = Object.keys(answers).filter((k) => {
                        const qi = questions[parseInt(k)];
                        return qi && answers[k] === qi.a;
                    }).length;
                    const pct = Math.round((score / totalQuestions) * 100);
                    const missedIdx = Object.keys(answers)
                        .filter((k) => {
                            const qi = questions[parseInt(k)];
                            return qi && answers[k] !== qi.a;
                        })
                        .map(Number);

                    return (
                        <div className="card p-6">
                            <div className="text-center mb-6">
                                <div className="text-5xl mb-3">
                                    {pct >= 80 ? "🎉" : pct >= 60 ? "💪" : "📚"}
                                </div>
                                <h3
                                    className="text-2xl font-bold mb-1"
                                    style={{
                                        fontFamily: "DM Serif Display,serif",
                                    }}
                                >
                                    {score} / {totalQuestions} — {pct}%
                                </h3>
                                <p
                                    className="text-sm"
                                    style={{
                                        color: darkMode ? "#94a3b8" : "#64748b",
                                    }}
                                >
                                    {pct >= 80
                                        ? "Excellent ! Module maîtrisé."
                                        : pct >= 60
                                        ? "Module validé. Quelques points à revoir."
                                        : "Continuez à réviser ce module."}
                                </p>
                            </div>

                            {/* Répartition */}
                            <div className="flex gap-2 justify-center mb-4 flex-wrap">
                                {questions.map((_, i) => (
                                    <div
                                        key={i}
                                        className={`w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold text-white`}
                                        style={{
                                            background:
                                                answers[i] === questions[i].a
                                                    ? "#22c55e"
                                                    : "#ef4444",
                                        }}
                                        title={
                                            answers[i] === questions[i].a
                                                ? "Correct"
                                                : "Incorrect"
                                        }
                                    >
                                        {i + 1}
                                    </div>
                                ))}
                            </div>

                            {/* Questions ratées */}
                            {missedIdx.length > 0 && (
                                <div className="mb-4">
                                    <div className="text-xs font-bold text-red-500 uppercase tracking-widest mb-2">
                                        Questions ratées à revoir :
                                    </div>
                                    <div className="space-y-2">
                                        {missedIdx.map((idx) => (
                                            <div
                                                key={idx}

                                <span
                                    className="text-sm font-bold"
                                    style={{
                                        color: darkMode ? "#94a3b8" : "#64748b",
                                    }}
                                >
                                    Question {current + 1}/{questions.length}
                                </span>
                                <span
                                    className="text-xs px-2 py-0.5 rounded-full font-bold"
                                    style={{
                                        background:
                                            q.type === "qcm"
                                                ? "#ede9fe"
                                                : "#dbeafe",
                                        color:
                                            q.type === "qcm"
                                                ? "#7c3aed"
                                                : "#1e40af",
                                    }}

                                    {q.type === "qcm" ? "QCM" : "Vrai / Faux"}

                            <div className="flex items-center gap-3">
                                <div className="flex gap-1">
                                    {questions.map((_, i) => (
                                        <div

                                            style={{
                                                width: i === current ? 24 : 8,
                                                background:
                                                    i === current
                                                        ? "#334155"
                                                        : answers[i] !==
                                                          undefined
                                                        ? answers[i] ===
                                                          questions[i].a

                                                            : "#ef4444"

                                                        ? "#334155"
                                                        : "#e2e8f0",

                                </div>
                                {answeredCount > 0 && (
                                    <button
                                        onClick={handleReset}
                                        title="Réinitialiser"
                                        className="text-xs text-slate-400 hover:text-red-500 transition-colors flex items-center gap-1 px-2 py-1 rounded-lg hover:bg-red-50"

                                        <Icons.Trash /> Reset
                                    </button>
                                )}
                            </div>
                        </div>

                        {/* Question */}
                        <p className="font-medium mb-5 leading-relaxed">
                            {q.q}
                        </p>

                        {/* VF Options */}
                        {q.type === "tf" && (
                            <div className="flex gap-3 mb-4">
                                {[true, false].map((val) => {
                                    let cls =
                                        "quiz-btn font-bold text-sm flex-1 ";

                                        if (val === q.a) cls += "correct";

                                            cls += "wrong";

                                        <button
                                            key={String(val)}
                                            disabled={answered}
                                            onClick={() => handleAnswer(val)}

                                            {val ? "✓ Vrai" : "✗ Faux"}

                                    );
                                })}
                            </div>
                        )}

                        {/* QCM Options */}
                        {q.type === "qcm" && (
                            <div className="space-y-2 mb-4">
                                {q.choices.map((choice, ci) => {
                                    let cls = "qcm-option ";
                                    if (answered) {
                                        cls += "disabled ";
                                        if (ci === q.a) cls += "reveal ";
                                        else if (ci === userAnswer)
                                            cls += "wrong ";
                                        else cls += "opacity-50 ";
                                    }
                                    return (
                                        <button
                                            key={ci}
                                            className={cls}
                                            disabled={answered}
                                            onClick={() => handleAnswer(ci)}

                                            <span
                                                className="w-6 h-6 rounded-full border-2 shrink-0 flex items-center justify-center text-xs font-bold"
                                                style={{
                                                    borderColor:
                                                        answered && ci === q.a
                                                            ? "#22c55e"
                                                            : answered &&
                                                              ci === userAnswer
                                                            ? "#ef4444"
                                                            : "#cbd5e1",
                                                    background:
                                                        answered && ci === q.a
                                                            ? "#22c55e"
                                                            : answered &&
                                                              ci === userAnswer
                                                            ? "#ef4444"
                                                            : "transparent",
                                                    color:
                                                        answered &&
                                                        (ci === q.a ||
                                                            ci === userAnswer)
                                                            ? "white"
                                                            : darkMode
                                                            ? "#e2e8f0"
                                                            : "#374151",
                                                }}

                                                {String.fromCharCode(65 + ci)}

                        {/* Feedback */}
                        {answered && (
                            <div
                                className={`rounded-xl p-4 mb-4 ${
                                    isCorrect
                                        ? "bg-emerald-50 border border-emerald-200"
