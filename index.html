                                <div
                                    className={`flex items-center gap-2 font-bold mb-2 text-sm ${
                                        isCorrect
                                            ? "text-emerald-700"
                                            : "text-red-700"
                                    }`}
                                >
                                    {isCorrect ? (
                                        <>
                                            <Icons.Check /> Bonne réponse !
                                        </>
                                    ) : (
                                        <>
                                            <Icons.X /> Incorrect
                                            {q.type === "tf"
                                                ? ` — La bonne réponse est : ${
                                                      q.a ? "VRAI" : "FAUX"
                                                  }`
                                                : ` — Bonne réponse : ${String.fromCharCode(
                                                      65 + q.a
                                                  )}`}
                                        </>
                                    )}
                                </div>
                                <p
                                    className={`text-xs leading-relaxed ${
                                        isCorrect
                                            ? "text-emerald-800"
                                            : "text-red-800"
                                    }`}
                                >
                                    {q.expl}
                                </p>
                            </div>
                        )}

                        {answered && (
                            <div className="flex justify-end">
                                <button
                                    onClick={handleNext}
                                    className="px-6 py-2 bg-slate-800 text-white rounded-xl font-bold hover:bg-slate-700 text-sm"
                                >
                                    {current < questions.length - 1
                                        ? "Question suivante →"
                                        : "Voir les résultats →"}
                                </button>
                            </div>
                        )}
                    </div>
                );
            };

            /* ============================================================
   FLASHCARD MODE (overlay)
   ============================================================ */
            const FlashcardMode = ({ module: mod, onClose }) => {
                const [idx, setIdx] = React.useState(0);
                const [flipped, setFlipped] = React.useState(false);
                const [known, setKnown] = React.useState(new Set());
                const cards = mod.flashcards || [];
                const total = cards.length;
                const card = cards[idx];
                const pct =
                    total > 0 ? Math.round((known.size / total) * 100) : 0;

                const next = (k) => {
                    if (k) setKnown((prev) => new Set([...prev, idx]));
                    setFlipped(false);
                    setTimeout(() => {
                        if (idx < total - 1) setIdx(idx + 1);
                    }, 200);
                };

                if (idx >= total)
                    return (
                        <div className="fc-overlay">
                            <div className="text-center text-white">
                                <div className="text-5xl mb-4">🎴</div>
                                <h2
                                    className="text-2xl font-bold mb-2"
                                    style={{
                                        fontFamily: "DM Serif Display,serif",
                                    }}
                                >
                                    Flashcards terminées !
                                </h2>
                                <p className="text-slate-400 mb-6">
                                    {known.size}/{total} cartes connues
                                </p>
                                <div className="flex gap-3 justify-center">
                                    <button
                                        onClick={() => {
                                            setIdx(0);
                                            setFlipped(false);
                                            setKnown(new Set());
                                        }}
                                        className="px-5 py-2 bg-white text-slate-800 rounded-xl font-bold hover:opacity-90"
                                    >
                                        Recommencer
                                    </button>
                                    <button
                                        onClick={onClose}
                                        className="px-5 py-2 border border-white text-white rounded-xl font-bold hover:bg-white hover:text-slate-800"
                                    >
                                        Fermer
                                    </button>
                                </div>
                            </div>
                        </div>
                    );

                return (
                    <div className="fc-overlay p-8">
                        {/* Header */}
                        <div className="w-full max-w-lg flex items-center justify-between mb-8">
                            <div>
                                <div className="text-slate-400 text-sm">
                                    {mod.emoji} {mod.title}
                                </div>
                                <div className="text-white font-bold">
                                    {idx + 1} / {total} — {pct}% maîtrisé
                                </div>
                            </div>
                            <button
                                onClick={onClose}
                                className="text-slate-400 hover:text-white transition-colors text-sm px-3 py-1 rounded-lg border border-slate-700 hover:border-white"
                            >
                                ✕ Fermer
                            </button>
                        </div>

                        {/* Progress */}
                        <div className="w-full max-w-lg mb-8">
                            <div
                                className="progress-bar"
                                style={{ background: "#1e3a5f" }}
                            >
                                <div
                                    className="progress-fill"
                                    style={{
                                        width: `${(idx / total) * 100}%`,
                                        background: "#f0a500",
                                    }}
                                />
                            </div>
                        </div>

                        {/* Card */}
                        <div
                            className="w-full max-w-lg"
                            style={{ perspective: 1000 }}
                        >
                            <div
                                onClick={() => setFlipped((f) => !f)}
                                style={{
                                    position: "relative",
                                    width: "100%",
                                    height: 220,
                                    cursor: "pointer",
                                    transformStyle: "preserve-3d",
                                    transition: "transform .5s",
                                    transform: flipped
                                        ? "rotateY(180deg)"
                                        : "rotateY(0deg)",
                                }}
                            >
                                {/* Front */}
                                <div
                                    style={{
                                        position: "absolute",
                                        inset: 0,
                                        backfaceVisibility: "hidden",
                                        display: "flex",
                                        flexDirection: "column",
                                        alignItems: "center",
                                        justifyContent: "center",
                                        background: "white",
                                        borderRadius: 16,
                                        padding: 24,
                                    }}
                                >
                                    <div className="text-xs text-indigo-500 font-bold uppercase tracking-widest mb-4">
                                        Concept
                                    </div>
                                    <p className="text-indigo-900 font-bold text-xl text-center">
                                        {card.front}
                                    </p>
                                    <p className="text-slate-400 text-xs mt-4">
                                        Cliquez pour révéler
                                    </p>
                                </div>
                                {/* Back */}
                                <div
                                    style={{
                                        position: "absolute",
                                        inset: 0,
                                        backfaceVisibility: "hidden",
                                        transform: "rotateY(180deg)",
                                        display: "flex",
                                        flexDirection: "column",
                                        alignItems: "center",
                                        justifyContent: "center",
                                        background: "#1e3a5f",
                                        borderRadius: 16,
                                        padding: 24,
                                    }}
                                >
                                    <div className="text-xs text-amber-400 font-bold uppercase tracking-widest mb-4">
                                        Définition
                                    </div>
                                    <p className="text-white text-center text-sm leading-relaxed">
                                        {card.back}
                                    </p>
                                </div>
                            </div>
                        </div>

                        {/* Buttons */}
                        <div className="flex gap-4 mt-8">
                            <button
                                onClick={() => next(false)}
                                className="px-6 py-3 bg-red-600 text-white rounded-xl font-bold hover:bg-red-700 flex-1 max-w-xs"
                            >
                                ✗ À revoir
                            </button>
                            <button
                                onClick={() => next(true)}
                                className="px-6 py-3 bg-emerald-600 text-white rounded-xl font-bold hover:bg-emerald-700 flex-1 max-w-xs"
                            >
                                ✓ Je sais
                            </button>
                        </div>
                        <p className="text-slate-600 text-xs mt-4">
                            Cliquez sur la carte pour la retourner
                        </p>
                    </div>
                );
            };

            /* ============================================================
   STATS PANEL
   ============================================================ */
            const StatsPanel = ({ completedModules, darkMode }) => {
                const allModules = modules;
                const totalQuestions = allModules.reduce(
                    (acc, m) => acc + m.quiz.length,
                    0
                );
                const answeredCount = allModules.reduce((acc, m) => {
                    const s = storage.getQuiz(m.id);
                    return acc + (s ? Object.keys(s.answers).length : 0);
                }, 0);
                const correctCount = allModules.reduce((acc, m) => {
                    const s = storage.getQuiz(m.id);
                    if (!s) return acc;
                    return (
                        acc +
                        Object.keys(s.answers).filter((k) => {
                            const q = m.quiz[parseInt(k)];
                            return q && s.answers[k] === q.a;
                        }).length
                    );
                }, 0);

                const streak = storage.getStreak();

                return (
                    <div className="card p-5">
                        <h3
                            className="font-bold mb-4"
                            style={{ fontFamily: "DM Serif Display,serif" }}
                        >
                            📊 Statistiques globales
                        </h3>
                        <div className="grid grid-cols-2 gap-3 mb-4">
                            {[
                                {
                                    label: "Modules complétés",
                                    val: `${completedModules.size}/${modules.length}`,
                                },
                                {
                                    label: "Questions répondues",
                                    val: `${answeredCount}/${totalQuestions}`,
                                },
                                {
                                    label: "Réponses correctes",
                                    val: `${correctCount}`,
                                },
                                {
                                    label: "Taux de réussite",
                                    val:
                                        answeredCount > 0
                                            ? `${Math.round(
                                                  (correctCount /
                                                      answeredCount) *
                                                      100
                                              )}%`
                                            : "—",
                                },
                            ].map((s, i) => (
                                <div
                                    key={i}
                                    className="p-3 rounded-xl text-center"
                                    style={{
                                        background: darkMode
                                            ? "#0f172a"
                                            : "#f8fafc",
                                        border: darkMode
                                            ? "1px solid #334155"
                                            : "1px solid #e2e8f0",
                                    }}
                                >
                                    <div
                                        className="text-xl font-bold"
                                        style={{ color: "#f0a500" }}
                                    >
                                        {s.val}
                                    </div>
                                    <div
                                        className="text-xs mt-0.5"
                                        style={{
                                            color: darkMode
                                                ? "#64748b"
                                                : "#94a3b8",
                                        }}
                                    >
                                        {s.label}
                                    </div>
                                </div>
                            ))}
                        </div>
                        {/* Par module */}
                        <div className="space-y-2">
                            {modules.map((m) => {
                                const s = storage.getQuiz(m.id);
                                const answered = s
                                    ? Object.keys(s.answers).length
                                    : 0;
                                const correct = s
                                    ? Object.keys(s.answers).filter((k) => {
                                          const q = m.quiz[parseInt(k)];
                                          return q && s.answers[k] === q.a;
                                      }).length
                                    : 0;
                                const pct =
                                    answered > 0
                                        ? Math.round((correct / answered) * 100)
                                        : 0;
                                return (
                                    <div key={m.id}>
                                        <div className="flex justify-between text-xs mb-1">
                                            <span
                                                style={{
                                                    color: darkMode
                                                        ? "#e2e8f0"
                                                        : "#374151",
                                                }}
                                            >
                                                {m.emoji} {m.title}
                                            </span>
                                            <span style={{ color: m.color }}>
                                                {answered > 0 ? `${pct}%` : "—"}
                                            </span>
                                        </div>
                                        <div className="perf-bar">
                                            <div
                                                className="perf-fill"
                                                style={{
                                                    width: `${pct}%`,
                                                    background: m.color,
                                                }}
                                            />
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                );
            };

            /* ============================================================
   MAIN APP
   ============================================================ */
            const App = () => {
                const [activeIdx, setActiveIdx] = React.useState(0);
                const [tab, setTab] = React.useState("cours");
                const [completedModules, setCompletedModules] = React.useState(
                    () => new Set(storage.getCompleted())
                );
                const [mobileOpen, setMobileOpen] = React.useState(false);
                const [showResetModal, setShowResetModal] =
                    React.useState(false);
                const [flashcardMode, setFlashcardMode] = React.useState(false);
                const [darkMode, setDarkMode] = React.useState(
                    storage.getDarkMode()
                );
                const [searchTerm, setSearchTerm] = React.useState("");
                const [searchResults, setSearchResults] = React.useState([]);
                const [favs, setFavs] = React.useState(
                    () => new Set(storage.getFavs())
                );
                const [annotations, setAnnotations] = React.useState(
                    storage.getAnnotations
                );
                const [streak, setStreak] = React.useState(storage.getStreak);
                const [showStats, setShowStats] = React.useState(false);
                const toast = useToast();

                const mod = modules[activeIdx];
                const progress = Math.round(
                    (completedModules.size / modules.length) * 100
                );

                // Dark mode effect
                React.useEffect(() => {
                    document.body.classList.toggle("dark", darkMode);
                    storage.setDarkMode(darkMode);
                }, [darkMode]);

                // Update streak on quiz complete
                const updateStreak = () => {
                    const today = new Date().toDateString();
                    const s = storage.getStreak();
                    if (s.last === today) return;
                    const yesterday = new Date(
                        Date.now() - 86400000
                    ).toDateString();
                    const newCount = s.last === yesterday ? s.count + 1 : 1;
                    const updated = { count: newCount, last: today };
                    storage.setStreak(updated);
                    setStreak(updated);
                    if (newCount > 1)
                        toast.show(`🔥 Streak ${newCount} jours !`);
                };

                // Search
                React.useEffect(() => {
                    if (!searchTerm.trim()) {
                        setSearchResults([]);
                        return;
                    }
                    const term = searchTerm.toLowerCase();
                    const results = [];
                    modules.forEach((m, mi) => {
                        m.content.sections.forEach((s, si) => {
                            const haystack = (
                                s.title +
                                " " +
                                (s.body || "") +
                                " " +
                                (s.items
                                    ? s.items
                                          .map(
                                              (i) =>
                                                  i.title +
                                                  " " +
                                                  (i.content || i.text || "")
                                          )
                                          .join(" ")
                                    : "")
                            ).toLowerCase();
                            if (haystack.includes(term))
                                results.push({
                                    moduleIdx: mi,
                                    sectionIdx: si,
                                    title: s.title,
                                    module: m.title,
                                    emoji: m.emoji,
                                });
                        });
                    });
                    setSearchResults(results.slice(0, 8));
                }, [searchTerm]);

                const handleModuleChange = (idx) => {
                    setActiveIdx(idx);
                    setTab("cours");
                    setMobileOpen(false);
                    window.scrollTo(0, 0);
                };

                const handleQuizComplete = (moduleId, score) => {
                    const m = modules.find((x) => x.id === moduleId);
                    if (m && score / m.quiz.length >= 0.6) {
                        setCompletedModules((prev) => {
                            const next = new Set([...prev, moduleId]);
                            storage.setCompleted([...next]);
                            return next;
                        });
                        toast.show(`✅ Module "${m.title}" validé !`);
                    }
                    updateStreak();
                };

                const handleResetModule = (moduleId) => {
                    setCompletedModules((prev) => {
                        const next = new Set(
                            [...prev].filter((id) => id !== moduleId)
                        );
                        storage.setCompleted([...next]);
                        return next;
                    });
                };

                const handleResetAll = () => {
                    storage.resetAll();
                    setCompletedModules(new Set());
                    setFavs(new Set());
                    setShowResetModal(false);
                    window.location.reload();
                };

                const toggleFav = (moduleId) => {
                    setFavs((prev) => {
                        const next = new Set(prev);
                        if (next.has(moduleId)) next.delete(moduleId);
                        else {
                            next.add(moduleId);
                            toast.show("⭐ Module ajouté aux favoris");
                        }
                        storage.setFavs([...next]);
                        return next;
                    });
                };

                const getModuleStatus = (m) => {
                    if (completedModules.has(m.id)) return "done";
                    const s = storage.getQuiz(m.id);
                    if (s && !s.done && Object.keys(s.answers).length > 0)
                        return "inprogress";
                    if (s && s.done) return "done_low";
                    return "untouched";
                };

                const getModuleIcon = (m) => {
                    const status = getModuleStatus(m);
                    if (status === "done") return "✅";
                    if (status === "inprogress") return "🔄";
                    return m.emoji;
                };

                if (flashcardMode)
                    return (
                        <FlashcardMode
                            module={mod}
                            onClose={() => setFlashcardMode(false)}
                        />
                    );

                return (
                    <div
                        className={`min-h-screen flex flex-col md:flex-row ${
                            darkMode ? "dark" : ""
                        }`}
                        style={{ background: darkMode ? "#0f172a" : "#fafaf8" }}
                    >
                        {/* Toast */}
                        <div className={`toast ${toast.visible ? "show" : ""}`}>
                            {toast.msg}
                        </div>

                        {/* Reset Modal */}
                        {showResetModal && (
                            <div className="modal-overlay">
                                <div className="card p-6 max-w-sm w-full shadow-2xl">
                                    <div className="text-2xl mb-3 text-center">
                                        ⚠️
                                    </div>
                                    <h3
                                        className="text-lg font-bold text-center mb-2"
                                        style={{
                                            fontFamily:
                                                "DM Serif Display,serif",
                                        }}
                                    >
                                        Tout réinitialiser ?
                                    </h3>
                                    <p
                                        className="text-sm text-center mb-5"
                                        style={{
                                            color: darkMode
                                                ? "#94a3b8"
                                                : "#64748b",
                                        }}
                                    >
                                        Toutes les réponses, favoris et
                                        annotations seront effacés.
                                    </p>
                                    <div className="flex gap-3">
                                        <button
                                            onClick={() =>
                                                setShowResetModal(false)
                                            }
                                            className="flex-1 px-4 py-2 rounded-xl border font-bold text-sm"
                                            style={{
                                                borderColor: darkMode
                                                    ? "#334155"
                                                    : "#e2e8f0",
                                            }}
                                        >
                                            Annuler
                                        </button>
                                        <button
                                            onClick={handleResetAll}
                                            className="flex-1 px-4 py-2 rounded-xl bg-red-500 text-white font-bold text-sm hover:bg-red-600"
                                        >
                                            Tout effacer
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Mobile header */}
                        <div
                            className="md:hidden sticky top-0 z-20 flex items-center justify-between px-4 py-3 shadow-md"
                            style={{ background: "#0b1829" }}
                        >
                            <div>
                                <div
                                    className="text-white font-bold text-sm"
                                    style={{
                                        fontFamily: "DM Serif Display,serif",
                                    }}
                                >
                                    Services Web
                                </div>
                                <div
                                    className="text-xs"
                                    style={{ color: "#f0a500" }}
                                >
                                    {mod.emoji} {mod.title}
                                </div>
                            </div>
                            <div className="flex items-center gap-3">
                                <button
                                    onClick={() => setDarkMode((d) => !d)}
                                    className="text-slate-400 hover:text-white"
                                >
                                    {darkMode ? <Icons.Sun /> : <Icons.Moon />}
                                </button>
                                <button
                                    onClick={() => setMobileOpen(!mobileOpen)}
                                    className="text-white"
                                >
                                    <Icons.Menu />
                                </button>
                            </div>
                        </div>

                        {/* Sidebar */}
                        <div
                            className={`sidebar w-full md:w-72 flex-shrink-0 flex flex-col ${
                                mobileOpen ? "block" : "hidden"
                            } md:flex md:sticky top-0 h-auto md:h-screen overflow-y-auto z-10`}
                        >
                            {/* Title */}
                            <div
                                className="p-6 hidden md:block"
                                style={{ borderBottom: "1px solid #1e3a5f" }}
                            >
                                <div className="flex items-center justify-between mb-1">
                                    <h1
                                        className="text-xl text-white font-bold leading-tight"
                                        style={{
                                            fontFamily:
                                                "DM Serif Display,serif",
                                        }}
                                    >
                                        Services Web
                                    </h1>
                                    <div className="flex items-center gap-2">
                                        {streak.count > 1 && (
                                            <div className="streak-badge flex items-center gap-1">
                                                <Icons.Fire />
                                                {streak.count}
                                            </div>
                                        )}
                                        <button
                                            onClick={() =>
                                                setDarkMode((d) => !d)
                                            }
                                            className="text-slate-500 hover:text-white transition-colors"
                                        >
                                            {darkMode ? (
                                                <Icons.Sun />
                                            ) : (
                                                <Icons.Moon />
                                            )}
                                        </button>
                                    </div>
                                </div>
                                <p
                                    className="text-xs"
                                    style={{ color: "#f0a500" }}
                                >
                                    M2 MIAGE IPM
                                </p>
                            </div>

                            {/* Search */}
                            <div
                                className="p-4"
                                style={{ borderBottom: "1px solid #1e3a5f" }}
                            >
                                <div className="relative">
                                    <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500">
                                        <Icons.Search />
                                    </span>
                                    <input
                                        type="text"
                                        className="nav-search pl-8"
                                        placeholder="Rechercher…"
                                        value={searchTerm}
                                        onChange={(e) =>
                                            setSearchTerm(e.target.value)
                                        }
                                    />
                                </div>
                                {searchResults.length > 0 && (
                                    <div className="mt-2 space-y-1">
                                        {searchResults.map((r, i) => (
                                            <button
                                                key={i}
                                                onClick={() => {
                                                    handleModuleChange(
                                                        r.moduleIdx
                                                    );
                                                    setSearchTerm("");
                                                }}
                                                className="w-full text-left px-3 py-2 rounded-lg hover:bg-navy-mid transition-colors"
                                                style={{
                                                    background: "#132238",
                                                }}
                                            >
                                                <div
                                                    className="text-xs font-bold"
                                                    style={{ color: "#f0a500" }}
                                                >
                                                    {r.emoji} {r.module}
                                                </div>
                                                <div className="text-xs text-slate-300 truncate">
                                                    {r.title}
                                                </div>
                                            </button>
                                        ))}
                                    </div>
                                )}
                            </div>

                            {/* Progress */}
                            <div
                                className="p-4"
                                style={{ borderBottom: "1px solid #1e3a5f" }}
                            >
                                <div className="flex justify-between text-xs mb-2">
                                    <span style={{ color: "#94a3b8" }}>
                                        Progression
                                    </span>
                                    <span className="font-bold text-white">
                                        {progress}%
                                    </span>
                                </div>
                                <div className="progress-bar">
                                    <div
                                        className="progress-fill"
                                        style={{ width: `${progress}%` }}
                                    />
                                </div>
                                <div className="flex items-center justify-between mt-2">
                                    <div
                                        className="text-xs"
                                        style={{ color: "#64748b" }}
                                    >
                                        {completedModules.size} /{" "}
                                        {modules.length} modules
                                    </div>
                                    <button
                                        onClick={() => setShowStats((s) => !s)}
                                        className="text-xs font-bold"
                                        style={{ color: "#f0a500" }}
                                    >
                                        {showStats ? "↑ Masquer" : "📊 Stats"}
                                    </button>
                                </div>
                                {showStats && (
                                    <div className="mt-3">
                                        <StatsPanel
                                            completedModules={completedModules}
                                            darkMode={darkMode}
                                        />
                                    </div>
                                )}
                            </div>

                            {/* Nav */}
                            <nav className="py-2 flex-1">
                                {modules.map((m, i) => (
                                    <button
                                        key={m.id}
                                        onClick={() => handleModuleChange(i)}
                                        className={`nav-btn w-full text-left px-4 py-3.5 flex items-start gap-3 ${
                                            activeIdx === i ? "active" : ""
                                        }`}
                                    >
                                        <span className="text-lg shrink-0 mt-0.5">
                                            {getModuleIcon(m)}
                                        </span>
                                        <div className="flex-1 min-w-0">
                                            <div
                                                className={`text-xs font-bold mb-0.5 ${
                                                    activeIdx === i
                                                        ? "text-amber-400"
                                                        : "text-slate-500"
                                                }`}
                                            >
                                                Module {i + 1}
                                            </div>
                                            <div
                                                className={`text-sm leading-tight ${
                                                    activeIdx === i
                                                        ? "text-white font-semibold"
                                                        : "text-slate-300"
                                                }`}
                                            >
                                                {m.title}
                                            </div>
                                        </div>
                                        <div className="flex items-center gap-1 shrink-0">
                                            {favs.has(m.id) && (
                                                <span className="text-amber-400 text-xs">
                                                    ★
                                                </span>
                                            )}
                                            {getModuleStatus(m) ===
                                                "inprogress" && (
                                                <span className="w-2 h-2 rounded-full bg-amber-400" />
                                            )}
                                        </div>
                                    </button>
                                ))}
                            </nav>

                            {/* Footer */}
                            <div
                                className="p-4"
                                style={{ borderTop: "1px solid #1e3a5f" }}
                            >
                                <button
                                    onClick={() => setShowResetModal(true)}
                                    className="w-full flex items-center justify-center gap-2 px-3 py-2.5 rounded-xl text-xs font-bold transition-colors"
                                    style={{
                                        color: "#64748b",
                                        background: "rgba(255,255,255,0.04)",
                                        border: "1px solid #1e3a5f",
                                    }}
                                    onMouseEnter={(e) => {
                                        e.currentTarget.style.color = "#ef4444";
                                        e.currentTarget.style.borderColor =
                                            "#7f1d1d";
                                    }}
                                    onMouseLeave={(e) => {
                                        e.currentTarget.style.color = "#64748b";
                                        e.currentTarget.style.borderColor =
                                            "#1e3a5f";
                                    }}
                                >
                                    <Icons.Trash /> Réinitialiser tout
                                </button>
                            </div>
                        </div>

                        {/* Content */}
                        <div className="flex-1 min-w-0 pb-16">
                            <div className="max-w-3xl mx-auto px-4 md:px-8 py-8">
                                {/* Module header */}
                                <div className="mb-6">
                                    <div className="module-tag mb-2">
                                        Module {activeIdx + 1} /{" "}
                                        {modules.length}
                                    </div>
                                    <div className="flex items-start justify-between gap-4">
                                        <div>
                                            <h2
                                                className="text-3xl md:text-4xl font-bold leading-tight mb-1"
                                                style={{
                                                    fontFamily:
                                                        "DM Serif Display,serif",
                                                    color: darkMode
                                                        ? "#f1f5f9"
                                                        : "#0f172a",
                                                }}
                                            >
                                                {mod.emoji} {mod.title}
                                            </h2>
                                            <p
                                                style={{
                                                    color: darkMode
                                                        ? "#64748b"
                                                        : "#94a3b8",
                                                }}
                                            >
                                                {mod.subtitle}
                                            </p>
                                        </div>
                                        <div className="flex items-center gap-2 shrink-0">
                                            <button
                                                onClick={() =>
                                                    toggleFav(mod.id)
                                                }
                                                className={`fav-btn p-2 rounded-xl hover:bg-amber-50 ${
                                                    favs.has(mod.id)
                                                        ? "active"
                                                        : ""
                                                }`}
                                            >
                                                <Icons.Star
                                                    filled={favs.has(mod.id)}
                                                />
                                            </button>
                                            {mod.flashcards &&
                                                mod.flashcards.length > 0 && (
                                                    <button
                                                        onClick={() =>
                                                            setFlashcardMode(
                                                                true
                                                            )
                                                        }
                                                        className="flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-bold text-white transition-opacity hover:opacity-90"
                                                        style={{
                                                            background:
                                                                mod.color,
                                                        }}
                                                    >
                                                        <Icons.Cards />{" "}
                                                        Flashcards (
                                                        {mod.flashcards.length})
                                                    </button>
                                                )}
                                        </div>
                                    </div>
                                </div>

                                {/* Tabs */}
                                <div
                                    className="flex gap-2 mb-6 p-1 rounded-xl w-fit"
                                    style={{
                                        background: darkMode
                                            ? "#1e293b"
                                            : "#f1f5f9",
                                    }}
                                >
                                    <button
                                        onClick={() => setTab("cours")}
                                        className={`tab-btn ${
                                            tab === "cours" ? "active" : ""
                                        }`}
                                    >
                                        📖 Cours
                                    </button>
                                    <button
                                        onClick={() => setTab("quiz")}
                                        className={`tab-btn ${
                                            tab === "quiz" ? "active" : ""
                                        } relative`}
                                    >
                                        🎯 Quiz ({mod.quiz.length} questions)
                                        {(() => {
                                            const s = storage.getQuiz(mod.id);
                                            if (
                                                s &&
                                                !s.done &&
                                                Object.keys(s.answers).length >
                                                    0
                                            )
                                                return (
                                                    <span className="ml-1.5 inline-block w-2 h-2 rounded-full bg-amber-400" />
                                                );
                                            return null;
                                        })()}
                                    </button>
                                </div>

                                {/* Course */}
                                {tab === "cours" && (
                                    <div className="space-y-4">
                                        {mod.content.sections.map(
                                            (section, i) => (
                                                <SectionRenderer
                                                    key={i}
                                                    section={section}
                                                    searchTerm={searchTerm}
                                                    sectionKey={`${mod.id}_${i}`}
                                                    annotations={annotations}
                                                    setAnnotations={
                                                        setAnnotations
                                                    }
                                                    darkMode={darkMode}
                                                />
                                            )
                                        )}
                                        <div className="flex justify-center pt-4">
                                            <button
                                                onClick={() => {
                                                    setTab("quiz");
                                                    window.scrollTo(0, 0);
                                                }}
                                                className="px-8 py-3 text-white rounded-xl font-bold shadow-lg hover:opacity-90 text-sm"
                                                style={{
                                                    background: mod.color,
                                                }}
                                            >
                                                Tester mes connaissances →
                                            </button>
                                        </div>
                                    </div>
                                )}

                                {/* Quiz */}
                                {tab === "quiz" && (
                                    <div className="space-y-4">
                                        <div
                                            className="card p-4"
                                            style={{
                                                background: darkMode
                                                    ? "#1e293b"
                                                    : "#f8fafc",
                                            }}
                                        >
                                            <p
                                                className="text-sm"
                                                style={{
                                                    color: darkMode
                                                        ? "#94a3b8"
                                                        : "#64748b",
                                                }}
                                            >
                                                <strong>
                                                    {mod.quiz.length} questions
                                                </strong>{" "}
                                                — Vrai/Faux et QCM tirées du
                                                cours. Questions marquées{" "}
                                                <span className="badge-piege">
                                                    ⚠️ Piège fréquent
                                                </span>{" "}
                                                sont les plus délicates.{" "}
                                                <span
                                                    style={{
                                                        color: darkMode
                                                            ? "#475569"
                                                            : "#94a3b8",
                                                    }}
                                                >
                                                    Réponses sauvegardées
                                                    automatiquement.
                                                </span>
                                            </p>
                                        </div>
                                        <QuizSection
                                            key={mod.id}
                                            moduleId={mod.id}
                                            questions={mod.quiz}
                                            moduleColor={mod.color}
                                            onComplete={(score) =>
                                                handleQuizComplete(
                                                    mod.id,
                                                    score
                                                )
                                            }
                                            onReset={handleResetModule}
                                            darkMode={darkMode}
                                        />
                                    </div>
                                )}

                                {/* Navigation */}
                                <div
                                    className="flex justify-between mt-8 pt-6"
                                    style={{
                                        borderTop: `1px solid ${
                                            darkMode ? "#1e293b" : "#e2e8f0"
                                        }`,
                                    }}
                                >
                                    <button
                                        disabled={activeIdx === 0}
                                        onClick={() =>
                                            handleModuleChange(activeIdx - 1)
                                        }
                                        className="px-5 py-2.5 rounded-xl font-bold disabled:opacity-30 text-sm"
                                        style={{
                                            color: darkMode
                                                ? "#94a3b8"
                                                : "#475569",
                                            background: darkMode
                                                ? "#1e293b"
                                                : "#f1f5f9",
                                        }}
                                    >
                                        ← Précédent
                                    </button>
                                    <button
                                        disabled={
                                            activeIdx === modules.length - 1
                                        }
                                        onClick={() =>
                                            handleModuleChange(activeIdx + 1)
                                        }
                                        className="px-5 py-2.5 text-white rounded-xl font-bold hover:opacity-90 disabled:opacity-30 text-sm"
                                        style={{ background: mod.color }}
                                    >
                                        Suivant →
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            ReactDOM.createRoot(document.getElementById("root")).render(
                <App />
            );
        </script>
    </body>
</html>
